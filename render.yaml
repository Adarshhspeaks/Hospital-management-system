services:
  # 1. Express API Web Service
  - type: web
    name: hms-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/initDb.js && node src/seed.js && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: "*"

  # 2. React Vite Frontend Static Site
  - type: web
    name: hospital-management-suite
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hms-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: hms-db
    databaseName: hms
    user: hms_user
    plan: free
